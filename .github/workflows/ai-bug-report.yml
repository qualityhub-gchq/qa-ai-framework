# AI Bug Reporter — DRAFT, finalized in Phase 5.
# Runs after a Regression run FAILS, reads the results and opens GitHub Issues.
#
# OFF by default. To enable:
#   1. Add secret  CLAUDE_CODE_OAUTH_TOKEN  (same one the AI Explorer uses; `claude setup-token`)
#   2. Add variable ENABLE_AI_BUG_REPORTER = true   (same page → Variables)
#
# ⚠️ Verify the claude-code-action inputs (especially claude_args / allowed tools) against
#    https://github.com/anthropics/claude-code-action before enabling — they change between versions.

name: AI Bug Reporter

on:
  workflow_run:
    workflows: ['Regression']
    types: [completed]

permissions:
  contents: read
  issues: write
  actions: read # needed to download artifacts from the Regression run
  id-token: write # used by claude-code-action authentication

jobs:
  report:
    # Guardrails: only on failure, only for non-PR runs (main / nightly / manual), only when enabled.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request' &&
      vars.ENABLE_AI_BUG_REPORTER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download test results from the failed run
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make sure the labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create bug        --color d73a4a --force
          gh label create ai-triaged --color 5319e7 --description "Filed by AI, needs human confirmation" --force
          gh label create automation-issue --color fbca04 --description "Test problem, not a product bug" --force

      - name: Triage failures and file issues
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model sonnet --max-turns 20 --allowedTools "Read,Glob,Grep,Write,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue comment:*)"'
          prompt: |
            You are a senior QA engineer triaging a failed regression run.
            Run URL: ${{ github.event.workflow_run.html_url }}
            Commit: ${{ github.event.workflow_run.head_sha }} (branch ${{ github.event.workflow_run.head_branch }})

            Read and follow .claude/skills/writing-bug-reports/SKILL.md and its linked files exactly.
            Inputs: test-results/results.json and any error-context.md under test-results/.
            Only tests whose final status is "failed" or "timedOut" after all retries are candidates.
            Use the run URL above as evidence in every issue or comment.
            Do not modify code. Finish with the Skill's summary table.
